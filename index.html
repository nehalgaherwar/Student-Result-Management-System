<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IIT Dholkpur | Student Result Portal</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Background -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">

        <!-- Language Switcher -->
        <div class="lang-switcher">
            <label for="languageSelect">
                <i class="fa-solid fa-globe"></i>
                <span data-i18n="select_lang">Language</span>
            </label>
            <select id="languageSelect" onchange="setLanguage(this.value)">
                <option value="en">English (English)</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="te">తెలుగు (Telugu)</option>
                <option value="bn">বাংলা (Bengali)</option>
                <option value="mr">मराठी (Marathi)</option>
            </select>
        </div>

        <!-- Header -->

        <div class="header">

            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <h1 data-i18n="portal_title">IIT Dholkpur</h1>

            <p data-i18n="portal_subtitle">Official Student Result Management Portal</p>

        </div>

        <!-- Search Card -->

        <div class="search-card">

            <div class="input-group">

                <label data-i18n="label_student_name">
                    <i class="fa-solid fa-user"></i>
                    Student Name
                </label>

                <input type="text" id="nameInput" placeholder="Enter Student Name" data-i18n-placeholder="placeholder_student_name">

            </div>

            <div class="input-group">

                <label data-i18n="label_roll_no">
                    <i class="fa-solid fa-id-card"></i>
                    Roll Number
                </label>

                <input type="number" id="rollInput" placeholder="101 - 160" data-i18n-placeholder="placeholder_roll_no">

            </div>

            <div class="input-group">

                <label data-i18n="label_semester">
                    <i class="fa-solid fa-book"></i>
                    Semester
                </label>

                <select id="semester">

                    <option value="sem1" data-i18n="sem_1">Semester 1</option>

                    <option value="sem2" data-i18n="sem_2">Semester 2</option>

                </select>

            </div>

            <button id="checkBtn" onclick="checkResult()" data-i18n="btn_check_result">

                <i class="fa-solid fa-magnifying-glass"></i>

                Check Result

            </button>

        </div>

        <!-- Loading -->

        <div id="loader" class="loader hidden">

            <div class="spinner"></div>

            <p data-i18n="fetching_result">Fetching Student Result...</p>

        </div>

        <!-- Result -->

        <div id="result"></div>

        <!-- Footer -->

        <footer>

            <p data-i18n="footer_cell">

                <i class="fa-solid fa-shield-halved"></i>

                IIT Dholkpur Examination Cell

            </p>

            <small data-i18n="footer_rights">

                © 2026 Student Result Management System

            </small>

        </footer>

    </div>

    <script src="translations.js"></script>
    <script src="script.js"></script>

</body>

</html>
